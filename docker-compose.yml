services:
  ui:
    build: ./ui
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quickshare:quickshare@db:5432/quickshare}
      LOCAL_STORAGE_PATH: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickshare
      POSTGRES_USER: quickshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickshare -d quickshare"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  postgres_data:
